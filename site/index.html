<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 앱 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171C;
    --panel: #1D2128;
    --ink: #EDEFF3;
    --ink-soft: #8B92A1;
    --line: rgba(255,255,255,0.08);
    --accent1: #D7263D;
    --accent2: #3D6E8F;
    --accent3: #2F5233;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--ink);
    font-family:'Inter', system-ui, sans-serif;
  }
  header{
    padding: 40px 24px 8px;
    text-align:center;
  }
  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size: 30px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .subtitle{ color: var(--ink-soft); font-size: 13px; }

  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 420px){
    .grid{ grid-template-columns: repeat(2, 1fr); gap: 16px; }
  }

  .app-tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .icon{
    width: 100%;
    aspect-ratio: 1;
    border-radius: 22%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 20px rgba(0,0,0,0.25);
    transition: transform .12s ease;
  }
  .app-tile:active .icon{ transform: scale(0.94); }
  .icon svg{ width: 46%; height: 46%; }
  .label{
    font-size: 12.5px;
    font-weight: 500;
    text-align:center;
    line-height:1.3;
    color: var(--ink);
  }
  .status{
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: -6px;
  }

  .app-tile.disabled{
    opacity: 0.4;
    pointer-events: none;
  }

  footer{
    text-align:center;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 20px 0 40px;
  }
</style>
</head>
<body>

<header>
  <h1>내 앱 모음</h1>
  <div class="subtitle">아이콘을 눌러 각 앱으로 이동합니다</div>
</header>

<main>
  <div class="grid">

    <a class="app-tile" href="./apps/gpx-tracker/">
      <div class="icon" style="background: linear-gradient(160deg, #24322A, #1D2128);">
        <svg viewBox="0 0 24 24" fill="none" stroke="#D7263D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20 L9 8 L13 15 L16 10 L21 20 Z"/>
          <circle cx="9" cy="8" r="1.4" fill="#D7263D" stroke="none"/>
        </svg>
      </div>
      <div class="label">GPX 고도 트래커</div>
    </a>

    <a class="app-tile" href="./apps/star-map/">
      <div class="icon" style="background: linear-gradient(160deg, #1E2233, #1D2128);">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8FB4E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 L13.6 9 L20 10 L15 14 L16.5 20 L12 16.5 L7.5 20 L9 14 L4 10 L10.4 9 Z"/>
        </svg>
      </div>
      <div class="label">야간항성의</div>
    </a>

    <a class="app-tile" href="./apps/senior-job/">
      <div class="icon" style="background: linear-gradient(160deg, #2A2320, #1D2128);">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E3A05C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.4"/>
          <path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/>
        </svg>
      </div>
      <div class="label">경력카드</div>
    </a>

  </div>
</main>

<footer>정적 페이지 · GitHub Pages로 서빙됨</footer>

</body>
</html>

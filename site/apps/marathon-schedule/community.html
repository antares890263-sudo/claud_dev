<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 · 러닝 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;
    --card-1:#FFFFFF;
    --card-2:#FAFAFB;
    --ink:#16181D;
    --ink-soft:#6B7280;
    --ink-faint:#9CA3AF;
    --forest:#4F46E5;
    --forest-2:#4338CA;
    --forest-soft:#EEF0FF;
    --trail:#EF4444;
    --trail-2:#DC2626;
    --trail-soft:#FEEBEC;
    --open:#16A34A;
    --open-bg:#DCFCE7;
    --closed:#6B7280;
    --closed-bg:#F1F2F4;
    --amber:#B45309;
    --amber-bg:#FEF3C7;
    --blue:#0891B2;
    --blue-bg:#ECFEFF;
    --line:#E7E8EC;
    --err:#DC2626;
    --err-bg:#FEE2E2;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 10px rgba(16,24,40,.06);
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Side nav (site-wide tabs) ---------- */
  .side-nav{
    position:fixed; top:0; left:0; bottom:0; width:212px; background:var(--card-1); border-right:1px solid var(--line);
    display:flex; flex-direction:column; z-index:200; padding:22px 14px;
  }
  .side-nav .brand{
    font-family:'Noto Sans KR', sans-serif; font-weight:800; font-size:14.5px; color:var(--ink);
    display:flex; align-items:center; gap:8px; margin:4px 10px 24px;
  }
  .side-nav .brand svg{flex:none;}
  .side-nav-list{display:flex; flex-direction:column; gap:4px;}
  .side-nav-link{
    display:flex; align-items:center; gap:10px; font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); text-decoration:none; padding:10px 12px; border-radius:10px; transition:background .12s ease, color .12s ease;
  }
  .side-nav-link svg{flex:none; opacity:.8;}
  .side-nav-link:hover{background:var(--card-2); color:var(--ink);}
  .side-nav-link.active{background:var(--forest-soft); color:var(--forest-2); font-weight:700;}
  .side-nav-link .soon{
    margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:9px; font-weight:700; color:var(--ink-faint);
    background:var(--card-2); border-radius:999px; padding:2px 7px; letter-spacing:.03em;
  }
  .side-nav-hub{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
  .side-nav-hub a{
    display:flex; align-items:center; gap:8px; font-family:'Noto Sans KR', sans-serif; font-size:12.5px; font-weight:600;
    color:var(--ink-faint); text-decoration:none; padding:9px 12px; border-radius:10px;
  }
  .side-nav-hub a:hover{background:var(--card-2); color:var(--ink-soft);}

  .page{max-width:720px; margin:0 auto 0 212px; padding:64px 24px 90px;}

  /* ---------- Breadcrumb ---------- */
  .crumb{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; margin-bottom:44px; flex-wrap:wrap;
  }
  .crumb .sep{color:var(--ink-faint);}
  .crumb .cur{color:var(--forest); font-weight:700;}

  /* ---------- Placeholder panel ---------- */
  .placeholder{
    background:var(--card-1); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    padding:56px 40px; text-align:center;
  }
  .placeholder-icon{
    width:56px; height:56px; border-radius:16px; background:var(--forest-soft); color:var(--forest);
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--amber); display:inline-flex; align-items:center; gap:8px; margin-bottom:16px;
  }
  .eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 3px var(--amber-bg);}
  h1.title{
    font-family:'Noto Sans KR', sans-serif; font-weight:800; font-size:clamp(22px, 3.4vw, 28px);
    line-height:1.35; margin:0 0 14px; color:var(--ink); letter-spacing:-.01em;
  }
  .sub{font-size:14.5px; line-height:1.85; color:var(--ink-soft); max-width:44ch; margin:0 auto 26px;}
  .feature-list{
    display:flex; flex-direction:column; gap:8px; text-align:left; max-width:340px; margin:0 auto;
  }
  .feature-row{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);
    background:var(--card-2); border-radius:10px; padding:10px 14px;
  }
  .feature-row svg{flex:none; color:var(--ink-faint);}

  footer{margin-top:44px; padding-top:22px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); text-align:center; line-height:1.7;}

  @media (max-width:640px){
    .side-nav{
      position:fixed; top:0; left:0; right:0; bottom:auto; width:auto; height:52px;
      flex-direction:row; align-items:center; padding:0 10px; gap:8px;
      border-right:none; border-bottom:1px solid var(--line); overflow-x:auto;
    }
    .side-nav .brand{display:none;}
    .side-nav-list{flex-direction:row; gap:4px;}
    .side-nav-link{padding:8px 11px; font-size:12.5px; white-space:nowrap;}
    .side-nav-link .soon{display:none;}
    .side-nav-hub{margin:0 0 0 auto; padding-top:0; border-top:none; flex:none;}
    .side-nav-hub a{padding:8px 10px; white-space:nowrap;}
    .page{padding:72px 18px 60px; margin-left:0;}
    .placeholder{padding:40px 22px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>

<nav class="side-nav" aria-label="사이트 메뉴">
  <div class="brand">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    러닝 허브
  </div>
  <div class="side-nav-list">
    <a class="side-nav-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      마라톤 일정
    </a>
    <a class="side-nav-link active" href="community.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      커뮤니티
      <span class="soon">SOON</span>
    </a>
  </div>
  <div class="side-nav-hub">
    <a href="../../">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      전체 허브로
    </a>
  </div>
</nav>

<div class="page">

  <div class="crumb">
    <span>홈</span><span class="sep">/</span><span class="cur">커뮤니티</span>
  </div>

  <div class="placeholder">
    <div class="placeholder-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div class="eyebrow"><span class="dot"></span>준비 중</div>
    <h1 class="title">커뮤니티 기능을 준비하고 있어요</h1>
    <p class="sub">완주 후기, 대회 팁, 함께 뛸 러닝 메이트 찾기 같은 기능을 곧 만나보실 수 있습니다. 조금만 기다려주세요!</p>
    <div class="feature-list">
      <div class="feature-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
        완주 후기 · 대회 리뷰 공유
      </div>
      <div class="feature-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        대회별 팁 · Q&amp;A
      </div>
      <div class="feature-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        같이 뛸 러닝 메이트 찾기
      </div>
    </div>
  </div>

  <footer>
    커뮤니티 기능은 현재 개발 중입니다. 원하는 기능이 있다면 언제든 의견을 들려주세요.
  </footer>
</div>

</body>
</html>
